<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-bar">
        <button id="homeBtn">
            ← Home
        </button>
    </div>

    <main id="gameWrapper">

        <div id="gameContainer">

            <div class="game-info">
                <div id="score">0</div>
                <div id="highScore">Best: 0</div>
            </div>

            <canvas id="game"></canvas>

            <div id="tapText">
                Tap to Play
            </div>

        </div>

    </main>

    <script src="game.js"></script>

</body>

</html>
