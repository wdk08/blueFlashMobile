<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2048</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="top-bar">
    <button id="homeBtn">
        ← Home
    </button>
</div>


<div class="game-container">

    <h1>2048</h1>

    <div class="stats">

        <div>
            Score
            <strong id="score">0</strong>
        </div>

        <div>
            Best
            <strong id="best">0</strong>
        </div>

    </div>


    <div id="board"></div>


    <button id="restart">
        Restart
    </button>

</div>


<script src="game.js"></script>

</body>

</html>
