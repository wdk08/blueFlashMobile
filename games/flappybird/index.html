<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flappy Bird</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

        <button id="homeBtn">
            ← Home
        </button>
    </div>

    </div>


    <script src="game.js"></script>

</body>

</html>
